<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Molecule Builder</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="editor.css" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; }
  #root { height: 100vh; }
  .mb-app { display: flex; flex-direction: column; height: 100vh; }
  .mb-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); background: var(--surface); border-bottom: 1px solid var(--border); flex: none; }
  .mb-brand { font-weight: 800; letter-spacing: -0.02em; font-size: var(--text-lg); display: flex; align-items: center; gap: var(--space-2); }
  .mb-dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #22d3ee); box-shadow: 0 0 0 4px var(--accent-soft); }
  .mb-readout { flex: 1; font-family: var(--mono); font-size: var(--text-sm); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mb-muted { color: var(--faint); }
  .mb-err { color: var(--err); }
  .mb-head-actions { display: flex; gap: var(--space-2); }
  .mb-stage { position: relative; flex: 1; min-height: 0; padding: var(--space-5); }
  .mb-json { position: absolute; top: calc(var(--space-5) + 8px); right: calc(var(--space-5) + 8px); width: 320px; max-height: 70vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-md); }
  .mb-json-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); font-size: var(--text-xs); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .mb-json pre { margin: 0; padding: var(--space-3); overflow: auto; font-family: var(--mono); font-size: var(--text-xs); line-height: 1.5; color: #1e293b; }
  @media (max-width: 620px) { .mb-json { right: 10px; left: 10px; width: auto; } .mb-readout { display: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="editor.js"></script>
<script src="builder.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
  }
</script>
</body>
</html>
